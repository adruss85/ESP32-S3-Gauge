; ESP32-S3-Gauge - digital boost gauge for the Waveshare ESP32-S3-LCD-1.85
;
; The real target is esp32s3. esp32dev remains a headless CANN listener for
; bench work on a plain WROOM board.

[platformio]
default_envs = esp32s3

[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
; Most WROOM devkits use a CH340 bridge: 460800 is its reliable ceiling.
upload_speed = 460800
build_src_filter =
    +<*>
    -<net/can_relay.cpp>
    -<hal/*>
    -<ui/*>
    -<app/lv_assert_glue.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DGAUGE_HAS_DISPLAY=0

[env:esp32s3]
platform = espressif32
framework = arduino
; Waveshare ESP32-S3-LCD-1.85: ESP32-S3R8, 16 MB quad flash, 8 MB OPI PSRAM,
; native USB-Serial/JTAG (there is no CH340 on this board).
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
upload_speed = 921600
monitor_speed = 115200

build_src_filter =
    +<*>
    -<net/can_relay.cpp>

build_flags =
    -Iinclude
    ; lv_conf.h lives in include/ and is picked up by every compilation unit.
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DBOARD_HAS_PSRAM
    ; Serial is the native USB CDC port (/dev/ttyACM0).
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DGAUGE_HAS_DISPLAY=1
    ; More invalid-area slots: one busy frame otherwise becomes a full
    ; 360x360 repaint.
    -DLV_INV_BUF_SIZE=64

lib_deps =
    lvgl/lvgl@9.3.0
