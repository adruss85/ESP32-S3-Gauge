; ESP32-S3-Gauge - digital boost gauge for the Waveshare ESP32-S3-LCD-1.85
;
; The real target is esp32s3. esp32dev remains a headless CANN listener for
; bench work on a plain WROOM board.

[platformio]
default_envs = esp32s3

; Pin the platform: `platform = espressif32` is ambiguous. A machine with the
; pioarduino fork installed globally resolves 55.03.312 (Arduino 3.3.12 /
; IDF 5.5.5), while a clean CI runner resolves the official registry package
; (8.0.0), which builds different firmware - 1,382,531 B vs 1,445,067 B - and
; emits no firmware.factory.bin, so the release job had nothing flashable. All
; recorded sizes and the hardware-tested images are the 55.03.312 fork.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip

[env:esp32dev]
framework = arduino
board = esp32dev
monitor_speed = 115200
; Most WROOM devkits use a CH340 bridge: 460800 is its reliable ceiling.
upload_speed = 460800
build_src_filter =
    +<*>
    -<net/can_relay.cpp>
    -<hal/*>
    -<ui/*>
    -<app/lv_assert_glue.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DGAUGE_HAS_DISPLAY=0

[env:esp32s3]
framework = arduino
; Waveshare ESP32-S3-LCD-1.85: ESP32-S3R8, 16 MB quad flash, 8 MB OPI PSRAM,
; native USB-Serial/JTAG (there is no CH340 on this board).
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
; Boot splash art. objcopy links it into flash; splash_img.cpp decodes it
; with the S3 mask ROM's TJpgDec into a temporary PSRAM buffer.
board_build.embed_files = assets/canvas-gauge-splash-466-base.jpg
upload_speed = 921600
monitor_speed = 115200

build_src_filter =
    +<*>
    -<net/can_relay.cpp>

build_flags =
    -Iinclude
    ; lv_conf.h lives in include/ and is picked up by every compilation unit.
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DBOARD_HAS_PSRAM
    ; Serial is the native USB CDC port (/dev/ttyACM0).
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DGAUGE_HAS_DISPLAY=1
    ; More invalid-area slots: the G-meter moves a blob plus 20 tail dots
    ; every 50 ms, and the mode fade makes both screens dirty at once. With
    ; 64 slots an overflow becomes a full 360x360 repaint, which is visibly
    ; slow; 128 keeps it to the affected areas.
    -DLV_INV_BUF_SIZE=128

lib_deps =
    lvgl/lvgl@9.3.0
