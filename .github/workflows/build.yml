name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio pyserial

      - name: Build esp32s3 (display)
        run: pio run -e esp32s3

      - name: Build esp32dev (headless)
        run: pio run -e esp32dev

      - name: Upload firmware.bin (esp32s3)
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/esp32s3/firmware.bin
          body: |
            ESP32-S3 Gauge firmware for Waveshare ESP32-S3-Touch-AMOLED-1.75
            - OTA: `curl -F "firmware=@firmware.bin" http://192.168.4.1/update`
          name: firmware-esp32s3.bin

      - name: Upload firmware.bin (esp32dev)
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/esp32dev/firmware.bin
          name: firmware-esp32dev.bin